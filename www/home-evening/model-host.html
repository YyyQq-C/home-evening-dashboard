<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家的三维模型</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#edf0f2;color:#26343b}header{height:88px;padding:20px 30px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dde3e6}h1{font-size:23px;margin:0 0 5px}header p{font-size:13px;color:#6c7980;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100dvh - 88px)}#viewport{position:relative;min-width:0;overflow:hidden}canvas{display:block;touch-action:none}.toolbar{position:absolute;top:20px;left:24px;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #d9e0e4;background:white;color:#33444d;border-radius:10px;padding:11px 15px;min-height:44px}button:hover{background:#f0f5f6}button[aria-pressed=true]{background:#e4f3ed;border-color:#7bac98;color:#176348}.hint{position:absolute;bottom:20px;left:24px;right:24px;color:#62737b;font-size:12px;pointer-events:none}aside{background:#fff;padding:24px;overflow:auto;border-left:1px solid #dde3e6}h2{font-size:18px;margin:0 0 6px}.sub{font-size:12px;color:#78868d;line-height:1.7;margin:0 0 20px}h3{font-size:13px;color:#77858b;margin:24px 0 10px}.light{display:flex;text-align:left;justify-content:space-between;align-items:center;width:100%;margin:8px 0;padding:11px 13px}.light small{display:block;font-size:11px;color:#7b898f;margin-top:4px}.dot{width:10px;height:10px;border-radius:50%;background:#c1cbd0;flex-shrink:0}.light[aria-pressed=true] .dot{background:#daa74c;box-shadow:0 0 0 4px #f6eddb}.notice{font-size:12px;line-height:1.8;padding:13px;background:#f5f7f8;border-radius:9px;margin-top:20px}#status{font-size:12px;color:#628171}.error{color:#a13333;padding:30px}@media(max-width:700px){header{padding:16px;height:82px}header p{max-width:245px;font-size:11px}main{height:auto;display:block}#viewport{height:65dvh}aside{border-left:0}.toolbar{left:12px;top:12px;gap:5px}.toolbar button{padding:8px;font-size:12px}.hint{left:12px;font-size:10px}h1{font-size:20px}}
body{background:#191b1d;color:#e1e2dd}header,aside{background:#202426;border-color:#363c3f}header p,.sub,h3{color:#99a4a7}.hint{color:#899699}button{background:#2b3235;color:#d9dfdf;border-color:#414a4e}button:hover{background:#374145}button[aria-pressed=true]{background:#493e29;color:#f7dd9c;border-color:#8c7650}.light small{color:#a8b1b1}.notice{background:#292f32;color:#a9b4b8}.light[aria-pressed=true] .dot{box-shadow:0 0 10px #edbe64}.toolbar{gap:6px}.toolbar button{font-size:12px;padding:9px 12px}.marker-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}.light-marker{position:absolute;transform:translate(-50%,-50%);width:0;height:0;min-width:0;min-height:0;box-sizing:border-box;padding:0;margin:0;border:var(--marker-border,1px) solid #fff9;border-radius:50%;background:#f6f7f5;color:#535d62;pointer-events:auto;box-shadow:0 2px 8px #0005;display:flex;align-items:center;justify-content:center;line-height:0;overflow:hidden}.light-marker svg{display:block;width:65%;height:65%;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.light-marker[aria-pressed=true]{background:#e9ad39;color:white;border-color:#ffd98c;box-shadow:0 0 var(--marker-glow,14px) #ffc45a66}.light-marker[hidden]{display:none}.light-marker:focus-visible{outline:3px solid white;outline-offset:3px}.toolbar{z-index:3}.hint{z-index:2}/* 仅展示可交互房屋模型，画布外围保持透明。 */body{background:transparent}header,aside,.toolbar,.hint{display:none}main{display:block;height:100dvh}#viewport{height:100dvh;background:transparent}</style><style>
html,body{margin:0;background:transparent!important;color-scheme:dark;overflow:hidden}
main,#viewport{height:100vh!important}.device-dialog,.device-sim-note{display:none!important}
body[data-marker-kind=lights] .device-layer,body:not([data-marker-kind=lights]):not([data-marker-kind=all]) .marker-layer,.device-marker[data-evening-hidden=true]{display:none!important}
/* 显式固定关闭态图标颜色，避免原模型 hover 白色描边与浅色底板重叠。 */
.device-marker{width:42px!important;height:42px!important;min-height:42px!important;padding:8px!important;background:#252820f2!important;color:var(--device-color)!important;border:1px solid var(--device-color)!important;box-shadow:0 4px 12px #0004!important;overflow:visible!important}
.device-marker[data-device-kind=ac]{--device-color:#9bc9ed!important}.device-marker[data-device-kind=floor]{--device-color:#e59e84!important}.device-marker[data-device-kind=fresh]{--device-color:#a6d4be!important}
.device-marker[aria-pressed=true]{background:var(--device-color)!important;color:#20251f!important}
.device-marker:after{content:attr(data-evening-label);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);font:18px 'Microsoft YaHei',system-ui;white-space:nowrap;background:#24271ff2;color:#f4ebd8;border-radius:20px;padding:8px 14px;pointer-events:none;opacity:0}
.device-marker:hover:after,.device-marker:focus-visible:after{opacity:1}
body[data-markers-visible=false] .marker-layer,body[data-markers-visible=false] .device-layer{display:none!important}
body[data-theme=light] .light-marker{background:#fffef9f0!important;color:#687265!important;border-color:#b9c0b0!important;box-shadow:0 3px 10px #31402c25!important}
body[data-theme=light] .light-marker[aria-pressed=true]{background:#be8529!important;color:#fff!important;border-color:#d0a55b!important}
body[data-theme=light] .device-marker{background:#fffef9f0!important}
body[data-theme=light] .device-marker[data-device-kind=ac]{--device-color:#3c799e!important}body[data-theme=light] .device-marker[data-device-kind=floor]{--device-color:#b96340!important}body[data-theme=light] .device-marker[data-device-kind=fresh]{--device-color:#45846a!important}
body[data-theme=light] .device-marker[aria-pressed=true]{background:var(--device-color)!important;color:#fff!important}
body[data-theme=light] .light-marker:after,body[data-theme=light] .device-marker:after{background:#fffffff5;color:#34402f;border-color:#c9cebe}
.light-marker{min-width:36px;min-height:36px;max-width:48px;max-height:48px;background:#252820e8!important;color:#a9ada2!important;border:1px solid #b7bdab80!important;box-shadow:0 4px 12px #0004!important;overflow:visible!important}
.light-marker[aria-pressed=true]{background:#d6a14aeb!important;color:#fff7e6!important}
.light-marker:before{content:'';position:absolute;inset:-5px;border-radius:50%}
.light-marker:after{content:attr(data-light-label);font:18px 'Microsoft YaHei',system-ui;position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;background:#24271ff2;color:#f4ebd8;border:1px solid #e7bd7935;border-radius:20px;padding:8px 14px;pointer-events:none;opacity:0}
.light-marker:hover:after,.light-marker:focus-visible:after{opacity:1}
/* 设备操作直接展开房间卡片，不再显示悬浮设备提示。 */
.light-marker:after,.device-marker:after{display:none!important;content:none!important}
</style></head>
<body><header><div><h1>家的三维模型</h1><p>示例户型</p></div><span id="status">正在加载模型</span></header><main><section id="viewport"><div class="toolbar"><button id="reset">恢复视角</button><button id="top">俯视户型</button><button id="secondary">查看次卧</button><button id="study">查看书房</button><button id="walls" aria-pressed="false">完整墙高</button><button id="door" aria-pressed="false">打开书房门</button><button id="storage" aria-pressed="false">打开储物间门</button><button id="export">导出模型</button></div><div class="hint">拖动旋转 · 滚轮 / 双指缩放 · 右键拖动平移 · 点击灯图标模拟开关</div></section><aside><h2>灯光预览</h2><p class="sub">与模型联动，仅模拟效果<br>尚未接入 Home Assistant</p><div id="lights"></div><button id="all" style="width:100%;margin-top:12px">全部关闭</button><div class="notice">书房按改造图构造，玻璃门向右收纳。房间采用温馨软装风格，家具和装饰为设计示意。玄关左侧为储物间，隔墙设推拉门。墙线按最新标注图重建，书房门采用改造方案。</div></aside></main><script type="module" src="./model-adapter.js"></script></body></html>
